[package]
name = "cloudcell"
version = "0.1.0"
edition = "2024"
authors = ["Cloudcell"]
description = "Sandbox-as-a-service control plane on AgentCell"
license = "MIT"
repository = "https://github.com/EeroEternal/cloudcell"
homepage = "https://cloudcell.dev"

[dependencies]
tokio = { version = "1.43", features = ["full"] }
axum = { version = "0.8", features = ["json", "ws", "macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "sqlite", "chrono", "uuid", "migrate"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.12", features = ["v4", "serde"] }
anyhow = "1.0"
thiserror = "2.0"
sha2 = "0.10"
argon2 = { version = "0.5", features = ["std"] }
futures-util = "0.3"

[dev-dependencies]
tokio-test = "0.4"
http-body-util = "0.1"
